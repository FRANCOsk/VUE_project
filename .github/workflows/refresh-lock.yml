name: Refresh Vue dependencies

on:
  push:
    branches:
      - chore/modernize-vue-dashboard

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: chore/modernize-vue-dashboard

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Rebuild dependency lock
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit dependency lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lock is already current."
          else
            git commit -m "build: refresh Vue dependency lock"
            git push
          fi

      - name: Validate clean installation
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test

      - name: Build application
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
