version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Bratislava
    open-pull-requests-limit: 5
    groups:
      vue-stack:
        patterns:
          - vue
          - vue-router
          - pinia
          - "@vue/*"
      build-and-test:
        patterns:
          - vite
          - vitest
          - "@vitejs/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Bratislava
